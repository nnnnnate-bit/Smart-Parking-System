<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Parking Management</title>
    <style>
        :root {
            --bg: #0b0f14;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --free: #00ff9c;
            --occupied: #ff4d4d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { margin: 10px 0; color: var(--accent); text-shadow: 0 0 15px rgba(88, 166, 255, 0.3); }

        /* Stats Header */
        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            width: 720px;
        }

        .stat-card {
            flex: 1;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border-bottom: 3px solid var(--accent);
            text-align: center;
        }

        .stat-val { font-size: 24px; font-weight: bold; color: white; }
        .stat-label { font-size: 12px; color: #8b949e; text-transform: uppercase; }

        /* Parking Layout */
        .parking-area {
            width: 720px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .lane {
            height: 80px;
            margin: 15px 0;
            position: relative;
            background: repeating-linear-gradient(45deg, #111 0px, #111 4px, #0d0d0d 4px, #0d0d0d 8px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.1);
            font-weight: bold;
            letter-spacing: 5px;
        }

        .lane::after {
            content: "";
            position: absolute;
            width: 100%;
            border-top: 2px dashed rgba(255,255,255,0.2);
        }

        .row { display: flex; justify-content: space-between; }

        .slot {
            width: 80px;
            height: 120px;
            border: 2px solid #30363d;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot:hover { border-color: var(--accent); background: rgba(88, 166, 255, 0.05); }
        .slot.selected { border-color: white; box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        .slot::before {
            content: attr(data-id);
            position: absolute;
            top: 5px;
            left: 8px;
            font-size: 10px;
            color: #8b949e;
        }

        .free { border-color: var(--free); }
        .occupied { border-color: var(--occupied); }

        /* Car Design */
        .car {
            width: 45px;
            height: 80px;
            border-radius: 8px;
            position: relative;
            transition: transform 0.3s ease-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Interaction Panel */
        .panel {
            width: 720px;
            margin-top: 20px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .info-group { display: flex; gap: 10px; }
        .info-box {
            flex: 1;
            background: #0d1117;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-remove { background: var(--occupied); color: white; }
        .btn-remove:hover { background: #ff1a1a; filter: brightness(1.2); }
        .btn-remove:disabled { background: #30363d; cursor: not-allowed; }

    </style>
</head>
<body>

<h1> Smart Parking System</h1>

<div class="dashboard">
    <div class="stat-card">
        <div class="stat-val" id="totalRevenue">$0.00</div>
        <div class="stat-label">Total Revenue</div>
    </div>
    <div class="stat-card">
        <div class="stat-val" id="availableCount">12</div>
        <div class="stat-label">Available Slots</div>
    </div>
</div>

<div class="parking-area">
    <div class="row" id="row1">
        </div>

    <div class="lane">ENTRY ➔ ➔ ➔ EXIT</div>

    <div class="row" id="row2">
        </div>
</div>

<div class="panel">
    <div class="info-group">
        <div class="info-box">
            <div class="stat-label">Selected</div>
            <div id="slotId" style="font-size: 18px; color: var(--accent);">None</div>
        </div>
        <div class="info-box">
            <div class="stat-label">Duration</div>
            <div id="time" style="font-size: 18px;">0s</div>
        </div>
        <div class="info-box">
            <div class="stat-label">Current Bill</div>
            <div id="price" style="font-size: 18px; color: var(--free);">$0.00</div>
        </div>
    </div>
    <button class="btn-remove" onclick="removeCar()" id="removeBtn" disabled>Checkout & Remove</button>
</div>

<script>
    const RATE_PER_MIN = 2.00;
    const row1 = document.getElementById("row1");
    const row2 = document.getElementById("row2");

    // State management with LocalStorage
    let state = JSON.parse(localStorage.getItem('park_data')) || Array(12).fill(null).map(() => ({
        occupied: false,
        startTime: null,
        color: null
    }));
    
    let lifetimeEarnings = parseFloat(localStorage.getItem('park_revenue')) || 0;
    let selectedIndex = null;

    // Initialize Slots
    function init() {
        for (let i = 0; i < 12; i++) {
            const slot = document.createElement("div");
            slot.className = "slot";
            slot.setAttribute("data-id", i + 1);
            slot.onclick = () => selectSlot(i);
            
            if (i < 6) row1.appendChild(slot);
            else row2.appendChild(slot);
        }
        updateUI();
    }

    function selectSlot(index) {
        selectedIndex = index;
        // If empty, park a car immediately on click
        if (!state[index].occupied) {
            const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
            state[index] = {
                occupied: true,
                startTime: new Date().getTime(),
                color: colors[Math.floor(Math.random() * colors.length)]
            };
            save();
        }
        updateUI();
    }

    function removeCar() {
        if (selectedIndex === null || !state[selectedIndex].occupied) return;

        const s = state[selectedIndex];
        const elapsedMinutes = (new Date().getTime() - s.startTime) / 60000;
        lifetimeEarnings += elapsedMinutes * RATE_PER_MIN;

        state[selectedIndex] = { occupied: false, startTime: null, color: null };
        save();
        updateUI();
    }

    function save() {
        localStorage.setItem('park_data', JSON.stringify(state));
        localStorage.setItem('park_revenue', lifetimeEarnings.toFixed(2));
    }

    function updateUI() {
        const slots = document.querySelectorAll(".slot");
        let freeCount = 0;

        slots.forEach((slot, i) => {
            const s = state[i];
            slot.classList.toggle("occupied", s.occupied);
            slot.classList.toggle("free", !s.occupied);
            slot.classList.toggle("selected", i === selectedIndex);
            
            // Render Car with "Shine" effect
            slot.innerHTML = s.occupied ? 
                `<div class="car" style="background: linear-gradient(145deg, ${s.color}, #222); border: 1px solid ${s.color};"></div>` : "";
            
            if (!s.occupied) freeCount++;
        });

        // Dashboard Updates
        document.getElementById("availableCount").textContent = freeCount;
        document.getElementById("totalRevenue").textContent = `$${lifetimeEarnings.toFixed(2)}`;

        // Selection Panel Updates
        const removeBtn = document.getElementById("removeBtn");
        if (selectedIndex !== null) {
            const s = state[selectedIndex];
            document.getElementById("slotId").textContent = "Slot " + (selectedIndex + 1);
            removeBtn.disabled = !s.occupied;

            if (s.occupied) {
                const elapsedMs = new Date().getTime() - s.startTime;
                const sec = Math.floor(elapsedMs / 1000);
                const min = Math.floor(sec / 60);
                document.getElementById("time").textContent = `${min}m ${sec % 60}s`;
                document.getElementById("price").textContent = `$${((elapsedMs / 60000) * RATE_PER_MIN).toFixed(2)}`;
            } else {
                document.getElementById("time").textContent = "---";
                document.getElementById("price").textContent = "$0.00";
            }
        }
    }

    setInterval(updateUI, 1000);
    init();
</script>

</body>
</html>
